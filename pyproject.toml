[project]
name = "readfetch-client"
version = "0.1.13"
description = "x402 REST client for readfetch.com (probe, text, …)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "eth-account>=0.13",
  "httpx>=0.27",
  "x402[httpx,evm]>=2.0",
]

[project.urls]
Homepage = "https://readfetch.com"
Repository = "https://github.com/readfetch/client-py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["readfetch_client"]
